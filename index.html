<!DOCTYPE html>
<html lang="en" data-theme="soft">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0897A">
<meta name="description" content="Bloom — a gentle cycle companion">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="./manifest.json">
<title>Bloom — Cycle Companion</title>
<link rel="stylesheet" href="./src/styles/tokens.css">
<link rel="stylesheet" href="./src/styles/themes.css">
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/animations.css">
</head>
<body>
  <div id="app-shell">
    <div class="offline-banner" id="offline-banner">You're offline — changes save locally</div>

    <main id="app-view" aria-live="polite"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-route="today"><span class="nav-icon">🌤️</span>Today</button>
      <button class="nav-item" data-route="calendar"><span class="nav-icon">📅</span>Calendar</button>
      <button class="nav-item" data-route="insights"><span class="nav-icon">📊</span>Insights</button>
      <button class="nav-item" data-route="garden"><span class="nav-icon">🌸</span>Garden</button>
      <button class="nav-item" data-route="settings"><span class="nav-icon">⚙️</span>Settings</button>
    </nav>
  </div>

  <div id="modal-container"></div>
  <div id="confirm-container"></div>
  <div id="toast-container"></div>
  <div id="welcome-gate-container"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
